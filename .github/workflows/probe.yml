name: Podcast probe
on:
  push:
    branches: [probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: |
          ./gradlew :app:testDevUnitTest --tests 'dev.lelonio.square.probe.*' -i > log.txt 2>&1 || true
          grep -E "PROBE|FAILED|error:|^e: " log.txt | head -n 120 > out.txt
          split -l 40 out.txt part-
          for p in part-*; do msg=$(sed 's/%/%25/g' "$p" | awk '{printf "%s%%0A", $0}'); echo "::notice title=$p::$msg"; done
