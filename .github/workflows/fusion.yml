name: Square Fusion APK

# Every push to main builds, tests and publishes an installable APK.
#
# The APK lands in two places:
#  - the workflow run's artifacts (needs a GitHub login to download), and
#  - a GitHub pre-release named after the build, plus the rolling "latest"
#    release, whose assets are plain links a phone can open directly.
#
# Signing: with the four SIGNING_* secrets set, the release key from those
# secrets. Without them, a debug key kept in the Actions cache so successive
# builds share it and install over one another. See docs/FUSION.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fusion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.id.outputs.version }}
      build: ${{ steps.id.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build identity
        id: id
        run: |
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=2.6.3-fusion.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # The fallback key, shared between runs through the cache so an APK
      # from one build installs over the one before it.
      - name: Restore fallback signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fusion-debug-keystore-v1

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/fusion-release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/fusion-release.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "SIGNED_WITH=release key (repository secrets)" >> "$GITHUB_ENV"
          else
            mkdir -p ~/.android
            if [ ! -f ~/.android/debug.keystore ]; then
              keytool -genkeypair -v -keystore ~/.android/debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Square Fusion CI,O=Square Fusion,C=US"
            fi
            echo "SIGNED_WITH=CI fallback key (no signing secrets set)" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDevUnitTest --stacktrace -PfusionBuild=${{ steps.id.outputs.build }} 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace \
            -PfusionBuild=${{ steps.id.outputs.build }} \
            -PsourceCommit=${{ steps.id.outputs.sha }} 2>&1 | tee "$RUNNER_TEMP/build.log"

      # The diagnosis as annotations on the run page, readable without
      # signing in: compiler errors, failed tests and Gradle's own summary.
      - name: Explain failure
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/tests.log" "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/androidtest.log"; do
            [ -f "$log" ] || continue
            grep -E "^e: |FAILED|Exception|What went wrong|^> |error:" "$log" | grep -v "^> Task" | head -n 120 > "$RUNNER_TEMP/errors.txt" || true
            split -l 12 "$RUNNER_TEMP/errors.txt" "$RUNNER_TEMP/chunk-"
            for chunk in "$RUNNER_TEMP"/chunk-*; do
              [ -f "$chunk" ] || continue
              msg=$(sed 's/%/%25/g' "$chunk" | awk '{printf "%s%%0A", $0}')
              echo "::error title=$(basename "$log")::$msg"
              rm "$chunk"
            done
          done
          for xml in app/build/test-results/*/*.xml; do
            [ -f "$xml" ] || continue
            grep -q "<failure" "$xml" && echo "::error title=test failure::$(basename "$xml"): $(grep -o '<failure message="[^"]*' "$xml" | head -n 3 | cut -c1-300 | tr '\n' ' ')"
          done
          exit 0

      # The debug build and Square Fusion's instrumented tests, for the
      # emulator job below.
      - name: Build instrumented tests
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace \
            -PfusionBuild=${{ steps.id.outputs.build }} 2>&1 | tee "$RUNNER_TEMP/androidtest.log"
          mkdir -p instrumented
          cp app/build/outputs/apk/debug/app-universal-debug.apk instrumented/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/*.apk instrumented/app-debug-androidTest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: instrumented-${{ steps.id.outputs.short }}
          path: instrumented/
          retention-days: 7

      - name: Verify APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-universal-release.apk
          test -s "$apk"
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/signature.txt"
          badging=$("$bt/aapt2" dump badging "$apk")
          echo "$badging" | head -n 3
          echo "$badging" | grep -q "package: name='dev.lelonio.square.fusion'"
          echo "$badging" | grep -q "versionName='${{ steps.id.outputs.version }}'"
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libsquarecore.so"
          for abi in arm64-v8a armeabi-v7a universal; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "square-fusion-${{ steps.id.outputs.version }}-$abi.apk"
          done
          cp "$apk" square-fusion.apk
          sha256sum square-fusion*.apk | tee SHA256SUMS.txt
          {
            echo "## Square Fusion ${{ steps.id.outputs.version }}"
            echo
            echo "- Commit: \`${{ steps.id.outputs.sha }}\`"
            echo "- Signed with: $SIGNED_WITH"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: square-fusion-${{ steps.id.outputs.version }}-${{ steps.id.outputs.short }}
          path: |
            square-fusion-*.apk
            SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="fusion-${{ steps.id.outputs.build }}"
          notes="Square Fusion ${{ steps.id.outputs.version }}
          Built from commit ${{ steps.id.outputs.sha }} by run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Signed with: $SIGNED_WITH
          Install square-fusion.apk (universal) or the file for your phone's ABI. It installs beside Square and does not replace it."
          gh release create "$tag" square-fusion*.apk SHA256SUMS.txt \
            --target "${{ steps.id.outputs.sha }}" --prerelease \
            --title "Square Fusion ${{ steps.id.outputs.version }}" --notes "$notes"
          # The rolling release whose asset URL never changes.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest square-fusion.apk SHA256SUMS.txt \
            --target "${{ steps.id.outputs.sha }}" --latest \
            --title "Square Fusion (latest: ${{ steps.id.outputs.version }})" --notes "$notes"

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ steps.id.outputs.short }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  # Installs the APK on an emulator and checks launch, intents, links, icon
  # aliases, background/resume and screen off/on. Does not block the release:
  # its result and screenshots are attached to it.
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: square-fusion-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: instrumented-*
          path: instrumented
          merge-multiple: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 11 images translate ARM code; the app ships ARM only.
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash -c 'set -o pipefail; bash scripts/fusion-smoke.sh "$(ls square-fusion-*-universal.apk | head -n 1)" 2>&1 | tee smoke-log.txt; s1=$?; bash scripts/fusion-instrumented.sh instrumented 2>&1 | tee instrumented-log.txt; s2=$?; [ $s1 = 0 ] && [ $s2 = 0 ]'

      - name: Attach results to the release
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f smoke-log.txt ] && cp smoke-log.txt smoke/ 2>/dev/null || true
          if [ -d smoke ]; then
            zip -qr smoke-results.zip smoke smoke-log.txt instrumented-log.txt || true
            gh release upload "fusion-${{ needs.apk.outputs.build }}" smoke-results.zip smoke-log.txt --clobber || true
            [ -f instrumented-log.txt ] && gh release upload "fusion-${{ needs.apk.outputs.build }}" instrumented-log.txt --clobber || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ needs.apk.outputs.version }}
          path: |
            smoke/
            smoke-log.txt
            instrumented-log.txt
          if-no-files-found: ignore
