name: Square Fusion APK

# Every push to main builds and tests an APK, runs it on an emulator, and
# only then publishes it. Pushes to other branches stop after the tests.
#
# The APK lands in two places:
#  - the workflow run's artifacts (needs a GitHub login to download), and
#  - a GitHub pre-release named after the build, plus the rolling "latest"
#    release, whose assets are plain links a phone can open directly and
#    which the app's own updater reads.
#
# A build signed with a different key than the published one could not be
# installed over it, so publishing stops in that case unless the run is
# started by hand with allow_new_signature.
#
# Signing: with the four SIGNING_* secrets set, the release key from those
# secrets. Without them, a debug key kept in the Actions cache so successive
# builds share it and install over one another. See docs/FUSION.md.
on:
  push:
    branches: [main, cleanup]
  pull_request:
  workflow_dispatch:
    inputs:
      allow_new_signature:
        description: Publish even if the signing key differs from the published APK's (the update will need an uninstall)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fusion-${{ github.ref }}
  # A newer push supersedes a run still in progress.
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.id.outputs.version }}
      build: ${{ steps.id.outputs.build }}
      sha: ${{ steps.id.outputs.sha }}
      short: ${{ steps.id.outputs.short }}
      same_key: ${{ steps.sig.outputs.same }}
      signed_with: ${{ steps.signed.outputs.with }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build identity
        id: id
        run: |
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
          # Upstream Square's version, as app/build.gradle.kts states it.
          upstream=$(sed -n 's/^ *versionName = "\([0-9.]*\)"$/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$upstream"
          echo "version=$upstream-fusion.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # The fallback key, shared between runs through the cache so an APK
      # from one build installs over the one before it.
      - name: Restore fallback signing key
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fusion-debug-keystore-v1

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/fusion-release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/fusion-release.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "SIGNED_WITH=release key (repository secrets)" >> "$GITHUB_ENV"
          else
            mkdir -p ~/.android
            if [ ! -f ~/.android/debug.keystore ]; then
              keytool -genkeypair -v -keystore ~/.android/debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Square Fusion CI,O=Square Fusion,C=US"
            fi
            echo "SIGNED_WITH=CI fallback key (no signing secrets set)" >> "$GITHUB_ENV"
          fi

      - name: Record signing
        id: signed
        run: echo "with=$SIGNED_WITH" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDevUnitTest --stacktrace -PfusionBuild=${{ steps.id.outputs.build }} 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace \
            -PfusionBuild=${{ steps.id.outputs.build }} \
            -PsourceCommit=${{ steps.id.outputs.sha }} 2>&1 | tee "$RUNNER_TEMP/build.log"

      # The diagnosis as annotations on the run page, readable without
      # signing in: compiler errors, failed tests and Gradle's own summary.
      - name: Explain failure
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/tests.log" "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/androidtest.log"; do
            [ -f "$log" ] || continue
            grep -E "^e: |FAILED|Exception|What went wrong|^> |error:" "$log" | grep -v "^> Task" | head -n 120 > "$RUNNER_TEMP/errors.txt" || true
            split -l 12 "$RUNNER_TEMP/errors.txt" "$RUNNER_TEMP/chunk-"
            for chunk in "$RUNNER_TEMP"/chunk-*; do
              [ -f "$chunk" ] || continue
              msg=$(sed 's/%/%25/g' "$chunk" | awk '{printf "%s%%0A", $0}')
              echo "::error title=$(basename "$log")::$msg"
              rm "$chunk"
            done
          done
          for xml in app/build/test-results/*/*.xml; do
            [ -f "$xml" ] || continue
            grep -q "<failure" "$xml" && echo "::error title=test failure::$(basename "$xml"): $(grep -o '<failure message="[^"]*' "$xml" | head -n 3 | cut -c1-300 | tr '\n' ' ')"
          done
          exit 0

      # The debug build and Square Fusion's instrumented tests, for the
      # emulator job below.
      - name: Build instrumented tests
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace \
            -PfusionBuild=${{ steps.id.outputs.build }} 2>&1 | tee "$RUNNER_TEMP/androidtest.log"
          mkdir -p instrumented
          cp app/build/outputs/apk/debug/app-universal-debug.apk instrumented/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/*.apk instrumented/app-debug-androidTest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: instrumented-${{ steps.id.outputs.short }}
          path: instrumented/
          retention-days: 7

      - name: Verify APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-universal-release.apk
          test -s "$apk"
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/signature.txt"
          badging=$("$bt/aapt2" dump badging "$apk")
          echo "$badging" | head -n 3
          echo "$badging" | grep -q "package: name='dev.lelonio.square.fusion'"
          echo "$badging" | grep -q "versionName='${{ steps.id.outputs.version }}'"
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libsquarecore.so"
          for abi in arm64-v8a armeabi-v7a universal; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "square-fusion-${{ steps.id.outputs.version }}-$abi.apk"
          done
          cp "$apk" square-fusion.apk
          sha256sum square-fusion*.apk | tee SHA256SUMS.txt
          {
            echo "## Square Fusion ${{ steps.id.outputs.version }}"
            echo
            echo "- Commit: \`${{ steps.id.outputs.sha }}\`"
            echo "- Signed with: $SIGNED_WITH"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The published APK and this one must share a signing key, or this one
      # cannot be installed over it. Compared on the certificate digest.
      - name: Signature continuity
        id: sig
        run: |
          set -uo pipefail
          bt="$ANDROID_HOME/build-tools/36.0.0"
          digest() { "$bt/apksigner" verify --print-certs "$1" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1; }
          new=$(digest square-fusion.apk)
          if curl -fsSL -o "$RUNNER_TEMP/published.apk" "${{ github.server_url }}/${{ github.repository }}/releases/latest/download/square-fusion.apk"; then
            old=$(digest "$RUNNER_TEMP/published.apk")
          else
            old=""
          fi
          echo "new $new"
          echo "::notice title=Signing::$SIGNED_WITH; fallback key cache hit: ${{ steps.keycache.outputs.cache-hit }}; certificate SHA-256 $new"
          echo "published ${old:-none}"
          if [ -z "$old" ] || [ "$old" = "$new" ]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "- Signing key: same as the published APK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Signing key changed::This APK is not signed with the published APK's key ($old). It cannot be installed over it; publishing is held back unless allow_new_signature is set."
            echo "- Signing key: **different from the published APK**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: square-fusion-${{ steps.id.outputs.version }}-${{ steps.id.outputs.short }}
          path: |
            square-fusion-*.apk
            SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ steps.id.outputs.short }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  # Installs the APK on an emulator: launch, intents, links, icon aliases,
  # Square Fusion's instrumented tests, then the Spotify import and direct
  # playback (scripts/fusion-playback.sh). A FAIL there holds the release
  # back; what the network refuses (YouTube, Spotify) is a WARN in the log.
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: square-fusion-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: instrumented-*
          path: instrumented
          merge-multiple: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 11 images translate ARM code; the app ships ARM only.
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash -c 'set -o pipefail; bash scripts/fusion-smoke.sh "$(ls square-fusion-*-universal.apk | head -n 1)" 2>&1 | tee smoke-log.txt; s1=$?; bash scripts/fusion-instrumented.sh instrumented 2>&1 | tee instrumented-log.txt; s2=$?; bash scripts/fusion-playback.sh 2>&1 | tee playback-log.txt; s3=$?; [ $s1 = 0 ] && [ $s2 = 0 ] && [ $s3 = 0 ]'

      # The results as annotations on the run page, readable without
      # downloading the artifact.
      - name: Summarise emulator results
        if: always()
        run: |
          for log in smoke-log.txt instrumented-log.txt playback-log.txt; do
            [ -f "$log" ] || { echo "::warning title=$log::missing"; continue; }
            level=notice
            grep -qE "^FAIL|FAILURES|Process crashed|INSTRUMENTATION_FAILED" "$log" && level=error
            grep -E "^(OK|FAIL|WARN) |^== |result|FAILURES|Tests run|OK \\(|^[a-zA-Z.]+Test[#:]|Process crashed|stack=|class=|test=" "$log" | head -n 90 > "$RUNNER_TEMP/lines.txt" || true
            split -l 30 "$RUNNER_TEMP/lines.txt" "$RUNNER_TEMP/part-"
            for part in "$RUNNER_TEMP"/part-*; do
              [ -f "$part" ] || continue
              msg=$(sed 's/%/%25/g' "$part" | awk '{printf "%s%%0A", $0}')
              echo "::$level title=$log::$msg"
              rm "$part"
            done
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ needs.apk.outputs.version }}
          path: |
            smoke/
            smoke-log.txt
            instrumented-log.txt
            playback/
            playback-log.txt
          if-no-files-found: ignore

  # Publishes only what built, passed the emulator and keeps the signing key.
  publish:
    needs: [apk, smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.apk.outputs.same_key == 'true' || inputs.allow_new_signature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: square-fusion-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: smoke-${{ needs.apk.outputs.version }}
          path: results

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.apk.outputs.version }}
          SHA: ${{ needs.apk.outputs.sha }}
          SIGNED_WITH: ${{ needs.apk.outputs.signed_with }}
        run: |
          set -euo pipefail
          tag="fusion-${{ needs.apk.outputs.build }}"
          notes="Square Fusion $VERSION
          Built from commit $SHA by run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Signed with: $SIGNED_WITH
          Install square-fusion.apk (universal) or the file for your phone's ABI. It installs beside Square and does not replace it."
          (cd results && zip -qr ../test-results.zip .) || true
          extra=""
          [ -f test-results.zip ] && extra="test-results.zip"
          gh release create "$tag" square-fusion*.apk SHA256SUMS.txt $extra \
            --target "$SHA" --prerelease \
            --title "Square Fusion $VERSION" --notes "$notes"
          # The rolling release whose asset URLs never change; the app's
          # updater reads its title for the version and picks its ABI's APK.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest square-fusion*.apk SHA256SUMS.txt \
            --target "$SHA" --latest \
            --title "Square Fusion (latest: $VERSION)" --notes "$notes"
